services:
  db:
    image: postgres:16-alpine
    container_name: volty-postgres
    environment:
      POSTGRES_USER: volty
      POSTGRES_PASSWORD: volty
      POSTGRES_DB: volty
    ports:
      - "5432:5432"
    volumes:
      - volty_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volty -d volty"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  volty_pgdata:
