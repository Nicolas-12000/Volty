name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Desplegar stack volty (si no, solo validación + build)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend test + Lambda zip
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/pytest -q
          cd ..
          VOLTY_SKIP_TESTS=1 ./scripts/build-lambda-api.sh

      - name: Validate CloudFormation
        run: |
          pip install cfn-lint
          cfn-lint -c infra/cloudformation/.cfnlintrc.yaml \
            --non-zero-exit-code error \
            infra/cloudformation/volty.yaml \
            infra/cloudformation/volty-cdn.yaml

      - name: Configure AWS credentials
        if: inputs.apply
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CloudFormation deploy
        if: inputs.apply
        env:
          JWT_SECRET: ${{ secrets.VOLTY_JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOLTY_DB_PASSWORD: ${{ secrets.VOLTY_DB_PASSWORD }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'http://localhost:3000,http://127.0.0.1:3000' }}
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="volty-artifacts-${ACCOUNT}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" \
              --create-bucket-configuration "LocationConstraint=$AWS_REGION"
          fi
          aws s3 cp infra/build/api.zip "s3://${BUCKET}/releases/api.zip"
          export BUCKET
          mapfile -t OVERRIDES < <(python3 scripts/gh-cfn-overrides.py)
          aws cloudformation deploy \
            --stack-name volty \
            --template-file infra/cloudformation/volty.yaml \
            --parameter-overrides "${OVERRIDES[@]}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
          MIGRATE=$(aws cloudformation describe-stacks --stack-name volty \
            --query "Stacks[0].Outputs[?OutputKey=='MigrateFunctionName'].OutputValue" --output text)
          aws lambda invoke --function-name "$MIGRATE" /tmp/migrate.json
          cat /tmp/migrate.json
