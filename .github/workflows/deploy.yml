name: Deploy AWS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Desplegar stack volty (si no, solo validación + build)"
        type: boolean
        default: true
      deploy_frontend:
        description: "Publicar front (S3 + CloudFront)"
        type: boolean
        default: true

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'backend/**'
              - 'infra/**'
              - 'scripts/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'

  api:
    needs: changes
    if: |
      needs.changes.outputs.api == 'true' &&
      (github.event_name == 'push' || inputs.apply)
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend test + Lambda zip
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/pytest -q
          cd ..
          VOLTY_SKIP_TESTS=1 ./scripts/build-lambda-api.sh

      - name: Validate CloudFormation
        run: |
          pip install cfn-lint
          cfn-lint -c infra/cloudformation/.cfnlintrc.yaml \
            --non-zero-exit-code error \
            infra/cloudformation/volty.yaml \
            infra/cloudformation/volty-cdn.yaml

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CloudFormation deploy (API)
        env:
          JWT_SECRET: ${{ secrets.VOLTY_JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOLTY_DB_PASSWORD: ${{ secrets.VOLTY_DB_PASSWORD }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'http://localhost:3000,http://127.0.0.1:3000' }}
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="volty-artifacts-${ACCOUNT}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" \
              --create-bucket-configuration "LocationConstraint=$AWS_REGION"
          fi
          aws s3 cp infra/build/api.zip "s3://${BUCKET}/releases/api.zip"
          export BUCKET
          mapfile -t OVERRIDES < <(python3 scripts/gh-cfn-overrides.py)
          aws cloudformation deploy \
            --stack-name volty \
            --template-file infra/cloudformation/volty.yaml \
            --parameter-overrides "${OVERRIDES[@]}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
          # Misma clave S3: CloudFormation no sustituye el zip. Hay que publicar el código a mano.
          for FN in volty-api volty-migrate; do
            aws lambda update-function-code --function-name "$FN" \
              --s3-bucket "$BUCKET" --s3-key releases/api.zip >/dev/null
            aws lambda wait function-updated-v2 --function-name "$FN"
          done
          MIGRATE=$(aws cloudformation describe-stacks --stack-name volty \
            --query "Stacks[0].Outputs[?OutputKey=='MigrateFunctionName'].OutputValue" --output text)
          aws lambda invoke --function-name "$MIGRATE" /tmp/migrate.json
          cat /tmp/migrate.json

  frontend:
    needs: [changes, api]
    if: |
      (github.event_name == 'push' || (inputs.apply && inputs.deploy_frontend)) &&
      (needs.changes.outputs.frontend == 'true' || needs.api.result == 'success') &&
      (needs.api.result == 'success' || needs.api.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Front estático → S3 + CloudFront
        run: |
          set -euo pipefail
          API_BASE=$(aws cloudformation describe-stacks --stack-name volty \
            --query "Stacks[0].Outputs[?OutputKey=='ApiBaseUrl'].OutputValue" --output text)
          export VOLTY_API_URL="${API_BASE%/}/api"
          echo "VOLTY_API_URL=$VOLTY_API_URL"
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          ./scripts/deploy-frontend.sh

      - name: URL del front
        run: |
          DOMAIN=$(aws cloudformation describe-stacks --stack-name volty-cdn \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDomain'].OutputValue" --output text)
          echo "::notice::Front publicado: https://${DOMAIN}"
