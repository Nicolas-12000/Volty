AWSTemplateFormatVersion: "2010-09-09"
Description: Volty - unico stack demo (plan estudiante). RDS micro, Lambda sin NAT ni VPC.

Metadata:
  com.aws.cloudformation.Context:
    arch: "Function URL > Lambda sin VPC > mercado/Gemini; RDS Postgres; secretos en params o GitHub (sin Secrets Manager)"
    must:
      - "BackupRetentionPeriod 0 en cuenta estudiante"
      - "Lambda Function URL CORS AllowMethods solo wildcard"

Parameters:
  ProjectName:
    Type: String
    Default: volty
  ArtifactsBucket:
    Type: String
  ApiObjectKey:
    Type: String
    Default: releases/api.zip
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ""
  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 128
    Description: Contraseña maestra Postgres (openssl rand -base64 24). GitHub secret VOLTY_DB_PASSWORD.
  CorsOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:3000"
  BackupRetentionPeriod:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 35
    Description: 0 para AWS Academy / créditos estudiante

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.31.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.31.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.31.2.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [1, !GetAZs ""]

  Igw:
    Type: AWS::EC2::InternetGateway

  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  PublicRtA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicRtB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Postgres Volty - Lambda sin VPC por endpoint publico RDS
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
          Description: Demo estudiante; proteger con DbPassword fuerte + cifrado en reposo

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets RDS Volty
      SubnetIds:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db"
      Engine: postgres
      AutoMinorVersionUpgrade: true
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      StorageEncrypted: true
      MasterUsername: volty
      MasterUserPassword: !Ref DbPassword
      DBName: volty
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      DBSubnetGroupName: !Ref DbSubnetGroup
      PubliclyAccessible: true
      BackupRetentionPeriod: !Ref BackupRetentionPeriod
      DeletionProtection: false
      CopyTagsToSnapshot: false
      MultiAZ: false

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-lambda"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-api"
      RetentionInDays: 7

  MigrateLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-migrate"
      RetentionInDays: 7

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - ApiLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-api"
      Runtime: python3.12
      Handler: handler.lambda_handler
      Timeout: 29
      MemorySize: 512
      Role: !GetAtt LambdaRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref ApiObjectKey
      Environment:
        Variables:
          DATABASE_URL: !Sub
            - "postgresql+psycopg://volty:${Pw}@${Host}:5432/volty"
            - Pw: !Ref DbPassword
              Host: !GetAtt Database.Endpoint.Address
          JWT_SECRET: !Ref JwtSecret
          GEMINI_API_KEY: !Ref GeminiApiKey
          MATIAS_THREAD_STORE: postgres
          MATIAS_BACKEND: gemini
          CORS_ORIGINS: !Join [",", !Ref CorsOrigins]
          DEMO_USER_EMAIL: demo@volty.dev
          DEMO_USER_PASSWORD: valle-0700
          DEMO_USER_NAME: Hogar demo

  MigrateFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - ApiFunction
      - MigrateLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-migrate"
      Runtime: python3.12
      Handler: handlers.migrate.lambda_handler
      Timeout: 120
      MemorySize: 512
      Role: !GetAtt LambdaRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref ApiObjectKey
      Environment:
        Variables:
          DATABASE_URL: !Sub
            - "postgresql+psycopg://volty:${Pw}@${Host}:5432/volty"
            - Pw: !Ref DbPassword
              Host: !GetAtt Database.Endpoint.Address

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref ApiFunction
      AuthType: NONE
      Cors:
        AllowOrigins: !Ref CorsOrigins
        AllowMethods:
          - "*"
        AllowHeaders:
          - authorization
          - content-type
        MaxAge: 3600

  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

Outputs:
  ApiBaseUrl:
    Description: URL base Function URL (añadir /api en el front)
    Value: !GetAtt FunctionUrl.FunctionUrl
  DatabaseEndpoint:
    Description: Host Postgres (no uses desde internet sin VPN; contraseña en parámetro)
    Value: !GetAtt Database.Endpoint.Address
  MigrateFunctionName:
    Value: !Ref MigrateFunction
  StackMode:
    Value: volty-student-unified
