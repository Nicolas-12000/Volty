AWSTemplateFormatVersion: "2010-09-09"
Description: Volty plan estudiante - RDS + MATIAS sin NAT (RDS micro, creditos edu).

Metadata:
  com.aws.cloudformation.Context:
    arch: "Lambda sin VPC (Energy-Charts/Gemini) + RDS Postgres accesible por hostname; sin NAT"

Parameters:
  ProjectName:
    Type: String
    Default: volty
  ArtifactsBucket:
    Type: String
  ApiObjectKey:
    Type: String
    Default: releases/api.zip
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ""
  CorsOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:3000"
  AdminCidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: CIDR permitido a 5432 en RDS (acota a tu IP/32 en demo seria)

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.31.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.31.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.31.2.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [1, !GetAZs ""]

  Igw:
    Type: AWS::EC2::InternetGateway

  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  PublicRtA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicRtB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS Volty student Postgres from Lambda
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref AdminCidr
          Description: Solo demo; restringe AdminCidr a tu IP

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets públicas Volty student
      SubnetIds:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB

  DbSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: Credencial Postgres Volty student
      GenerateSecretString:
        SecretStringTemplate: '{"username":"volty"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-student-db"
      Engine: postgres
      AutoMinorVersionUpgrade: true
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      StorageEncrypted: true
      MasterUsername: volty
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
      DBName: volty
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      DBSubnetGroupName: !Ref DbSubnetGroup
      PubliclyAccessible: true
      BackupRetentionPeriod: 3
      DeletionProtection: false
      MultiAZ: false

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-student-lambda"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-db-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DbSecret

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: Database
    Properties:
      FunctionName: !Sub "${ProjectName}-api-student"
      Runtime: python3.12
      Handler: handler.lambda_handler
      Timeout: 29
      MemorySize: 1024
      Role: !GetAtt LambdaRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref ApiObjectKey
      Environment:
        Variables:
          DATABASE_URL: !Sub
            - "postgresql+psycopg://volty:${Pw}@${Host}:5432/volty"
            - Pw: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
              Host: !GetAtt Database.Endpoint.Address
          JWT_SECRET: !Ref JwtSecret
          GEMINI_API_KEY: !Ref GeminiApiKey
          MATIAS_THREAD_STORE: postgres
          MATIAS_BACKEND: gemini
          CORS_ORIGINS: !Join [",", !Ref CorsOrigins]
          DEMO_USER_EMAIL: demo@volty.dev
          DEMO_USER_PASSWORD: valle-0700
          DEMO_USER_NAME: Hogar demo

  MigrateFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiFunction
    Properties:
      FunctionName: !Sub "${ProjectName}-migrate-student"
      Runtime: python3.12
      Handler: handlers.migrate.lambda_handler
      Timeout: 120
      MemorySize: 512
      Role: !GetAtt LambdaRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref ApiObjectKey
      Environment:
        Variables:
          DATABASE_URL: !Sub
            - "postgresql+psycopg://volty:${Pw}@${Host}:5432/volty"
            - Pw: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
              Host: !GetAtt Database.Endpoint.Address

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref ApiFunction
      AuthType: NONE
      Cors:
        AllowOrigins: !Ref CorsOrigins
        AllowMethods:
          - DELETE
          - GET
          - PATCH
          - POST
          - "*"
        AllowHeaders:
          - authorization
          - content-type
        MaxAge: 3600

  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

Outputs:
  ApiBaseUrl:
    Value: !GetAtt FunctionUrl.FunctionUrl
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  MigrateFunctionName:
    Value: !Ref MigrateFunction
  StackMode:
    Value: student-no-nat-postgres-public
